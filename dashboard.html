<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body{
      font-family: Arial;
      margin:0;
      background:#f4f4f4;
    }

    .top{
      background:blue;
      color:white;
      padding:15px;
      text-align:center;
    }

    .box{
      display:flex;
      justify-content:space-around;
      margin-top:20px;
    }

    .card{
      background:white;
      padding:20px;
      width:200px;
      border-radius:10px;
      box-shadow:0 0 10px gray;
      text-align:center;
    }

    .btn{
      margin-top:10px;
      padding:10px;
      background:green;
      color:white;
      border:none;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="top">
  <h2>My Dashboard</h2>
</div>

<div class="box">

  <div class="card">
    <h3>Balance</h3>
    <p>0 PKR</p>
  </div>

  <div class="card">
    <h3>Referrals</h3>
    <p>0 Users</p>
  </div>

  <div class="card">
    <h3>Earnings</h3>
    <p>0 PKR</p>
  </div>

</div>

<div style="text-align:center; margin-top:30px;">
  <button class="btn">Withdraw</button>
</div>

</body>
</html>
